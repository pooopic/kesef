# בנייה ופרסום אוטומטיים.
# כל push ל-main: מריץ בדיקות → בונה APK חתום → מפרסם Release ב-GitHub.
# האפליקציה בטלפון רואה את ה-Release החדש ומציעה לעדכן.
# הודעת ה-commit הופכת ל"מה חדש" שמוצג באפליקציה, אז כדאי לכתוב אותה בעברית ברורה.

name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kesef.p12"

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/kesef.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "kesef-$VERSION.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VERSION" "kesef-$VERSION.apk" --title "כסף $VERSION" --notes-file notes.txt
